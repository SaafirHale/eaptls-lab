#!/usr/sbin/nft -f
# Port control for the wired authenticator.
#
# br0 bridges "uplink" (LabNet) and "access" (LabAccess). Until hostapd marks a
# MAC authorized, nothing from the access port is forwarded. EAPOL is never
# forwarded at all: it is link-local (01:80:C2:00:00:03), so the bridge hands it
# to hostapd on the access port instead.
flush ruleset

table bridge dot1x {
    set authorized {
        type ether_addr
    }

    chain forward {
        type filter hook forward priority 0; policy accept;
        iifname "access" ether saddr != @authorized counter drop
    }
}
